<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b100b">
<link rel="manifest" href="./manifest.json">
<title>Miraculous Land</title>
<style>
:root{--bg:#0b100b;--panel:rgba(12,18,12,.8);--fg:#e8efe0;--line:#3a4a36}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:0;right:0;top:0;padding:max(32px,calc(12px + env(safe-area-inset-top,0px))) 10px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);font-size:12px}
#hud{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 48px);width:150px;display:grid;gap:4px}
.bar{height:16px;background:#0008;border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block}
.bar span{position:absolute;left:6px;top:0;font-size:11px;line-height:15px}
#toast,#hint{position:fixed;left:50%;transform:translateX(-50%);background:var(--panel);padding:6px 12px;border-radius:10px;pointer-events:none;text-align:center}
#toast{top:30%;opacity:0;transition:opacity .3s}
#hint{top:62%}
#dock{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--panel);display:grid;gap:6px}
#inv{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.slot{aspect-ratio:1;max-height:46px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;font-size:22px;background:#0006;cursor:pointer}
.slot b{position:absolute;right:3px;bottom:1px;font-size:11px}
#craft{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}#chest{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
button{background:#25361f;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer}
button:disabled{opacity:.4}
#btns{display:flex;gap:6px}
#bAct{flex:1}
.cb{display:inline-flex;align-items:center;gap:4px}.bar span svg{vertical-align:-3px}.cb svg{flex:none}.slot svg{pointer-events:none}
.bar i{transition:width .35s}.slot.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 50px rgba(200,20,20,.85);opacity:0}
#menu{position:fixed;left:0;top:0;bottom:0;width:min(430px,100%);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto;touch-action:pan-y;background:linear-gradient(90deg,rgba(7,11,7,.94),rgba(7,11,7,.78));display:none;z-index:20}
#menu[data-page="main"]{padding-bottom:calc(54px + env(safe-area-inset-bottom,0px))}
#menu[data-page="pause"]{top:0;bottom:0;height:100%;width:min(430px,100%);background:linear-gradient(90deg,rgba(7,11,7,.97),rgba(7,11,7,.9))}
.mb.danger,.danger{background:#702626;border-color:#c75b52;color:#fff}
.confirm{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:#000b}
.confirm-card{width:min(360px,100%);padding:18px;border:1px solid #79504a;border-radius:16px;background:#151a15;box-shadow:0 12px 40px #000b}
.confirm-card h3{margin:0 0 10px}.confirm-card p{line-height:1.45;opacity:.85}.save-notice{color:#a9ed91;font-weight:700}
@media(max-width:760px){#menu[data-page="pause"]{top:0;bottom:0;height:100%;width:100%}}

body.menu #menu{display:block}
body.menu #dock,body.menu #hud,body.menu #hint,body.menu #top,body.menu #toast{display:none}
#menu.busy::after{content:attr(data-busy);position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo{text-align:center;margin:8px 0 14px}.logo h1{margin:6px 0 2px;font-size:26px}.sub{opacity:.6;font-size:12px}.info{font-size:13px;opacity:.8;text-align:center;margin-bottom:10px}
#menu h2{margin:4px 0 12px;font-size:22px}
.mb{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;margin:8px 0;font-size:17px;border-radius:14px;background:#22331c;border:1px solid #4a6a3c}.mb:active{background:#2f4a26}
.mr{margin:12px 0}.ml{font-size:12px;opacity:.75;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.ch{padding:7px 11px;border-radius:999px;font-size:13px}.ch.on{background:#3f7a2f;border-color:#8be36a}
.sws{display:flex;flex-wrap:wrap;gap:9px}.swc{width:32px;height:32px;border-radius:50%;border:2px solid #0009;padding:0}.swc.on{outline:3px solid #fff;outline-offset:1px}
#menu input[type=text]{width:100%;padding:10px 12px;font:inherit;border-radius:10px;border:1px solid #4a6a3c;background:#0b120b;color:var(--fg);user-select:text}
#menu input[type=range]{width:100%}
.sd{display:flex;gap:8px;align-items:center}.sd .mb{width:auto;margin:0;padding:9px 12px}
.presets{display:grid;gap:8px;margin-bottom:6px}.pr{text-align:left;padding:10px 12px;border-radius:12px;display:grid;gap:2px}.pr small{opacity:.7}.pr i{font-style:normal;font-size:11px;opacity:.55}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs .ch{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.acts{margin-top:14px}
#top-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:max-content;line-height:1.1}#fps{position:static;font-size:11px;background:var(--panel);padding:2px 6px;border-radius:8px;z-index:5}
#bMenu{padding:4px 8px;line-height:0}input{user-select:text}
@media(max-width:760px){#menu{top:auto;height:60%;width:100%;background:rgba(7,11,7,.93)}}
#dead{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;line-height:2}
#update-status{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 44px);transform:translateX(-50%);z-index:1000;padding:7px 12px;border:1px solid #53654b;border-radius:10px;background:rgba(8,14,8,.94);color:#e8efe0;font-size:12px;pointer-events:none;box-shadow:0 4px 18px #0008;white-space:nowrap}
#update-status[hidden]{display:none!important}
#autotest-report{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:#000c;overflow:auto;touch-action:pan-y}
#autotest-report[hidden]{display:none!important}
#autotest-report .test-card{width:min(520px,100%);max-height:100%;overflow:auto;padding:20px;border:1px solid #53654b;border-radius:16px;background:#101910;box-shadow:0 12px 40px #000b}
#autotest-report h2{margin:0 0 14px;font-size:21px}
#autotest-report p{margin:9px 0}
#autotest-report pre{max-height:35vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#0006;border-radius:8px;padding:10px;font:12px/1.45 monospace}
#autotest-report button{width:100%;margin-top:12px;padding:11px}
</style></head><body>
<script>(function(){
var errorBox=document.createElement('pre');
errorBox.id='ml-startup-error';
errorBox.style.cssText='display:none;position:fixed;z-index:99998;left:8px;right:8px;top:92px;bottom:8px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border:2px solid #d65b4d;border-radius:10px;background:rgba(15,8,8,.97);color:#fff;font:12px/1.5 monospace;touch-action:pan-y;user-select:text';
document.body.appendChild(errorBox);
function showError(err){
var msg=err&&err.stack?err.stack:(typeof err==='string'?err:String(err||'Неизвестная ошибка'));
errorBox.textContent='MIRACULOUS LAND — ОШИБКА ЗАПУСКА\n\n'+msg;
errorBox.style.display='block';
}
window.__ML_SHOW_STARTUP_ERROR=showError;
window.onerror=function(message,source,line,column,error){
showError(error||String(message)+'\n'+String(source||'')+':'+line+':'+column);
return false;
};
window.addEventListener('unhandledrejection',function(event){showError(event.reason||'Unhandled promise rejection')});
var button=document.createElement('button');
button.type='button';
button.textContent='🔄 Обновить из GitHub';
button.style.cssText='position:fixed;top:44px;right:16px;z-index:99999;padding:9px 12px;border:1px solid #8bbd78;border-radius:10px;background:#253f20;color:#fff;font:600 13px system-ui,sans-serif;box-shadow:0 3px 12px #0009;touch-action:manipulation';
function fallbackUpdate(){
try{
if(window.MLAndroid&&typeof window.MLAndroid.checkUpdatesFromGame==='function'){window.MLAndroid.checkUpdatesFromGame();return}
if(!('serviceWorker'in navigator))throw new Error('Service Worker недоступен');
navigator.serviceWorker.getRegistration('./').then(function(reg){return reg||navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'})}).then(function(reg){if(reg.active)reg.active.postMessage({type:'ML_CHECK_UPDATES'});return reg.update()}).catch(showError);
}catch(e){showError(e)}
}
button.addEventListener('click',function(){try{if(typeof window.ML_CHECK_UPDATES==='function')window.ML_CHECK_UPDATES();else fallbackUpdate()}catch(e){showError(e)}});
document.body.appendChild(button);
})();</script>

<div id="top"><button id="bMenu"></button><b id="gname"></b><span id="gver"></span><span id="pname"></span><span id="top-right"><span id="clock"></span><span id="weather-label"></span><span id="status-label"></span><span id="fps" hidden></span></span></div>
<div id="update-status" role="status" aria-live="polite">Проверка обновлений...</div>
<div id="hud"></div><div id="toast"></div><div id="hint" hidden></div>
<div id="dock">
 <div id="craft" hidden></div><div id="chest" hidden></div><div id="inv"></div>
 <div id="btns"><button id="bAct"></button><button id="bCraft"></button><button id="bDel"></button><button id="bNew"></button></div>
</div>
<div id="menu"></div><div id="autotest-report" hidden></div><div id="hurt"></div><div id="dead" hidden><div><span id="dtxt"></span><br><button id="bRe"></button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
<script>if ('serviceWorker' in navigator) {
  const updateStatus = document.getElementById('update-status');
  let updateReloading = false;
  let updateHideTimer = 0;
  function showUpdateStatus(message) {
    if (!updateStatus) return;
    clearTimeout(updateHideTimer);
    updateStatus.textContent = message;
    updateStatus.hidden = false;
  }
  function hideUpdateStatus() {
    if (!updateStatus) return;
    clearTimeout(updateHideTimer);
    updateStatus.hidden = true;
  }
  function reloadForUpdate() {
    if (updateReloading) return;
    updateReloading = true;
    showUpdateStatus('Обновление готово · запуск...');
    try { if (typeof window.save === 'function') window.save(); } catch (_) {}
    setTimeout(() => window.location.reload(), 180);
  }
  navigator.serviceWorker.addEventListener('message', event => {
    const data = event.data || {};
    if (data.type === 'ML_UPDATE_CHECKING') {
      showUpdateStatus('Проверка обновлений...');
    } else if (data.type === 'ML_UPDATE_DOWNLOADING') {
      showUpdateStatus('Загрузка файлов...');
    } else if (data.type === 'ML_UPDATE_READY' || data.type === 'ML_ASSETS_UPDATED') {
      reloadForUpdate();
    } else if (data.type === 'ML_UPDATE_DONE' || data.type === 'ML_UPDATE_OFFLINE' || data.type === 'ML_UPDATE_FAILED') {
      updateHideTimer = setTimeout(hideUpdateStatus, 350);
    }
  });
  window.addEventListener('load', () => {
    if (!navigator.onLine) hideUpdateStatus();
    navigator.serviceWorker.register('./sw.js', {scope: './', updateViaCache: 'none'})
      .then(registration => registration.update())
      .catch(hideUpdateStatus);
    updateHideTimer = setTimeout(() => {
      if (updateStatus && updateStatus.textContent === 'Проверка обновлений...') hideUpdateStatus();
    }, 5000);
  });
} else {
  const status = document.getElementById('update-status');
  if (status) status.hidden = true;
}</script></body></html>
